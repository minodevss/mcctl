[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/minodevss/mcctl"
publish = false

[workspace.dependencies]
mcctl-dns = { path = "crates/mcctl-dns" }
mcctl-platform = { path = "crates/mcctl-platform" }
mcctl-protocol = { path = "crates/mcctl-protocol" }
mcctl-router = { path = "crates/mcctl-router" }

clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
toml = "1.1.8"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
