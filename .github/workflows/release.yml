name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p mcctl --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/mcctl mcctl-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcctl-${{ matrix.target }}
          path: mcctl-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Collect assets
        run: cp distribution/install.sh distribution/systemd/mcctl.service distribution/systemd/mc@.service dist/
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cd dist
          sha256sum mcctl-* install.sh mcctl.service mc@.service > SHA256SUMS
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${RUNNER_TEMP}/minisign.key"
          minisign -S -s "${RUNNER_TEMP}/minisign.key" -m SHA256SUMS -t "mcctl ${GITHUB_REF_NAME}"
          rm "${RUNNER_TEMP}/minisign.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
